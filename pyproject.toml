[build-system]
requires = ["setuptools >= 69"]
build-backend = "setuptools.build_meta"

[project]
name = "more.transaction"
version = "1.0.0.dev0"
dynamic = ["readme"]
description = "Transaction integration for Morepath"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Martijn Faassen", email = "faassen@startifact.com"}]
maintainers = [{name = "Henri Hulski", email = "henri@sancode.it"}]
keywords = ["morepath", "sqlalchemy", "zodb", "transaction"]
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "Typing :: Typed",
]
requires-python = ">= 3.11"
dependencies = [
    "morepath >= 1.0.0",
    "transaction >= 5.1",
]

[project.urls]
Documentation = "https://github.com/morepath/more.transaction/blob/master/README.rst"
Repository = "https://github.com/morepath/more.transaction"
Issues = "https://github.com/morepath/more.transaction/issues"
Changelog = "https://github.com/morepath/more.transaction/blob/master/CHANGES.rst"

[project.optional-dependencies]
test = ["pytest >= 9", "WebTest >= 3.0.1", "pytest-env"]
coverage = ["pytest-cov"]
lint = ["ruff"]
mypy = ["mypy", "pytest", "types-WebTest >= 3"]
pyright = ["pyright", "pytest", "WebTest >= 3.0.1", "types-WebTest >= 3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

[tool.pytest]
minversion = "9.0"
addopts = [
    "-vv",
    "--import-mode=importlib",
]
consider_namespace_packages = true
testpaths = ["src"]
env = ["RUN_ENV=test"]
filterwarnings = [
    "ignore:'cgi' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
omit = ["src/more/transaction/tests/*"]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TC", "UP", "RUF", "PYI"]
ignore = ["E501", "RUF012"]
future-annotations = true

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
known-first-party = ["morepath"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]

[tool.tox]
requires = ["tox>=4.21.1"]
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "pypy3",
    "coverage",
    "lint",
    "mypy",
    "pyright",
]
skip_missing_interpreters = true

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314", "coverage", "lint", "mypy", "pyright"]
"3.15" = ["py315"]
"pypy-3.12" = ["pypy3"]

[tool.tox.env_run_base]
package = "editable"
extras = ["test"]
commands = [["pytest", "{posargs:src}"]]

[tool.tox.env.coverage]
base_python = ["python3.14"]
extras = ["test", "coverage"]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "{posargs:src}"],
]

[tool.tox.env.lint]
base_python = ["python3.14"]
extras = ["lint"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.mypy]
base_python = ["python3.14"]
extras = ["mypy"]
commands = [
    ["mypy", "--python-version", "3.11"],
    ["mypy", "--python-version", "3.12"],
    ["mypy", "--python-version", "3.13"],
    ["mypy", "--python-version", "3.14"],
    ["mypy", "--python-version", "3.15"],
]

[tool.tox.env.pyright]
base_python = ["python3.14"]
extras = ["pyright"]
commands = [
    ["pyright", "--pythonversion", "3.11"],
    ["pyright", "--pythonversion", "3.12"],
    ["pyright", "--pythonversion", "3.13"],
    ["pyright", "--pythonversion", "3.14"],
    ["pyright", "--pythonversion", "3.15"],
]

[tool.zest-releaser]
release = false
upload-pypi = false
tag-format = "v{version}"
